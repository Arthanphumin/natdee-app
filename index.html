<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าแรก - ระบบบริการ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
  
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      color: #1f2937;
    }
  
    .container {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
      width: 100%;
      max-width: 380px;
    }
  
    h2 {
      margin: 0 0 8px 0;
      color: #06C755;
      font-size: 22px;
      font-weight: 700;
    }
  
    p {
      color: #6b7280;
      font-size: 14px;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
  
    /* แดชบอร์ดการ์ดสถิติ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
  
    .stat-card {
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      border-radius: 14px;
      padding: 14px 12px;
      text-align: left;
      border-left: 4px solid #06C755;
      transition: transform 0.15s ease;
    }
  
    .stat-card:active {
      transform: scale(0.98);
    }
  
    .stat-card.total { border-left-color: #3b82f6; }
    .stat-card.done { border-left-color: #10b981; }
    .stat-card.upcoming { border-left-color: #f59e0b; }
    .stat-card.overdue { border-left-color: #ef4444; }
  
    .stat-title {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 4px;
    }
  
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }
  
    /* ปุ่มกด */
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
  
    .btn:active {
      transform: scale(0.98);
    }
  
    .btn-primary {
      background-color: #06C755;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
    }
  
    .btn-primary:hover {
      background-color: #05b34c;
    }
  
    .btn-secondary {
      background-color: #f3f4f6;
      color: #374151;
    }
  
    .btn-secondary:hover {
      background-color: #e5e7eb;
    }
  </style>
  
</head>
<body>

  <div class="container">
    <h2>ยินดีต้อนรับ</h2>
    <p id="user-greeting">กำลังโหลดข้อมูลผู้ใช้...</p>

    <!-- ปุ่มลิงก์ไปยังหน้าแดชบอร์ดสถิติ -->
    <a href="stats.html" class="btn btn-primary">ดูสถิติของฉัน</a>
    
    <!-- ปุ่มปิดหน้าต่าง LIFF -->
    <button class="btn btn-secondary" onclick="closeApp()">ปิดหน้าต่าง</button>
  </div>

  <script>
    async function initLiff() {
      try {
        await liff.init({ liffId: "2011350023-6ASKwrct" }); // แทนที่ด้วย LIFF ID ของคุณ
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        
        const profile = await liff.getProfile();
        document.getElementById('user-greeting').innerText = `สวัสดีคุณ ${profile.displayName}`;
      } catch (err) {
        console.error("LIFF Initialization failed", err);
        document.getElementById('user-greeting').innerText = "ยินดีต้อนรับสู่ระบบบริการ";
      }
    }

    function closeApp() {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        alert("คุณไม่ได้เปิดใช้งานผ่านแอปพลิเคชัน LINE");
      }
    }

    initLiff();
  </script>

</body>
</html>

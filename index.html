<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าแรก - ระบบบริการ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .container {
      background: #fff;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 350px;
    }
    h2 {
      margin-top: 0;
      color: #06C755;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn-primary {
      background-color: #06C755;
      color: white;
    }
    .btn-primary:hover {
      background-color: #05b34c;
    }
    .btn-secondary {
      background-color: #e4e6eb;
      color: #333;
    }
    .btn-secondary:hover {
      background-color: #d8dadf;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>ยินดีต้อนรับ</h2>
    <p id="user-greeting">กำลังโหลดข้อมูลผู้ใช้...</p>

    <!-- ปุ่มลิงก์ไปยังหน้าแดชบอร์ดสถิติ -->
    <a href="stats.html" class="btn btn-primary">ดูสถิติของฉัน</a>
    
    <!-- ปุ่มปิดหน้าต่าง LIFF -->
    <button class="btn btn-secondary" onclick="closeApp()">ปิดหน้าต่าง</button>
  </div>

  <script>
    async function initLiff() {
      try {
        await liff.init({ liffId: "YOUR_LIFF_ID" }); // แทนที่ด้วย LIFF ID ของคุณ
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        
        const profile = await liff.getProfile();
        document.getElementById('user-greeting').innerText = `สวัสดีคุณ ${profile.displayName}`;
      } catch (err) {
        console.error("LIFF Initialization failed", err);
        document.getElementById('user-greeting').innerText = "ยินดีต้อนรับสู่ระบบบริการ";
      }
    }

    function closeApp() {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        alert("คุณไม่ได้เปิดใช้งานผ่านแอปพลิเคชัน LINE");
      }
    }

    initLiff();
  </script>

</body>
</html>

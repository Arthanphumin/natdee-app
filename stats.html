<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สถิติของฉัน - LINE LIFF</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h2 { margin-top: 0; color: #06C755; }
  </style>
</head>
<body>
  <h2>แดชบอร์ดสถิติ</h2>
  <div id="stats-container" class="card">กำลังโหลดข้อมูลจาก LINE...</div>

  <script>
    window.onload = async function() {
      try {
        // 1. เริ่มต้น LIFF SDK
        await liff.init({ liffId: "2011350023-6ASKwrct" });
        
        // 2. เช็กว่าเปิดในแอป LINE หรือไม่ ถ้าไม่ได้ล็อกอินให้ล็อกอินก่อน
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        
        // 3. ดึง Profile ของผู้ใช้
        const profile = await liff.getProfile();
        const userId = profile.userId;

        document.getElementById('stats-container').innerText = 'กำลังดึงข้อมูลสถิติ...';

        // 4. ยิง Fetch ไปหา n8n / ngrok
        const response = await fetch(`https://starless-karma-willing.ngrok-free.dev/webhook/liff-dashboard-data?userId=${userId}`);
        const result = await response.json();

        if (result.status === "success") {
          const d = result.data;
          document.getElementById('stats-container').innerHTML = `
            <p><b>ยอดนัดหมายทั้งหมด:</b> ${d.totalAppointments}</p>
            <p><b>งานที่เสร็จสิ้น:</b> ${d.completedJobs}</p>
            <p><b>รายได้รวม:</b> ${d.revenue} บาท</p>
          `;
        } else {
          document.getElementById('stats-container').innerText = 'ไม่พบข้อมูลสถิติของคุณ';
        }
      } catch (err) {
        console.error("LIFF Error:", err);
        document.getElementById('stats-container').innerText = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สถิติของฉัน - LINE LIFF</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }

    .header { margin-bottom: 16px; }
    h2 { margin: 0 0 4px 0; color: #06C755; font-size: 22px; font-weight: 700; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0; }

    /* การ์ดสถิติ 4 ช่อง */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border-left: 5px solid #cbd5e1;
    }
    .stat-card.total { border-left-color: #3b82f6; }
    .stat-card.done { border-left-color: #10b981; }
    .stat-card.upcoming { border-left-color: #f59e0b; }
    .stat-card.cancelled { border-left-color: #ef4444; }

    .stat-title { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 800; color: #0f172a; }

    /* ส่วนกล่องกราฟ */
    .section-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    .section-header-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    /* ปุ่มแท็บสลับมุมมอง (Segmented Toggle) */
    .toggle-container {
      display: flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }
    .toggle-btn {
      flex: 1;
      padding: 6px 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #ffffff;
      color: #06C755;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .chart-container {
      position: relative;
      height: 190px;
      width: 100%;
    }

    /* กล่องคำแนะนำ */
    .insight-card {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .insight-header {
      font-size: 13px;
      font-weight: 700;
      color: #166534;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .insight-body {
      font-size: 13px;
      color: #15803d;
      line-height: 1.55;
    }

    /* แถบหมวดหมู่ */
    .cat-item { margin-bottom: 10px; }
    .cat-item:last-child { margin-bottom: 0; }
    .cat-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 4px;
    }
    .cat-bar-bg {
      background: #f1f5f9;
      height: 7px;
      border-radius: 10px;
      overflow: hidden;
    }
    .cat-bar-fill {
      background: #06C755;
      height: 100%;
      border-radius: 10px;
    }

    .btn-refresh {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 13px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-refresh:active { background: #f8fafc; }

    .loading-box {
      background: #ffffff;
      padding: 35px 20px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>แดชบอร์ดสถิติ</h2>
    <p class="subtitle">ภาพรวมและบทวิเคราะห์ตารางชีวิตของคุณ</p>
  </div>

  <div id="content-container">
    <div class="loading-box">🔄 กำลังโหลดข้อมูลสถิติ...</div>
  </div>

  <button class="btn-refresh" onclick="fetchData()">🔄 รีเฟรชข้อมูล</button>

  <script>
    let myChart = null;
    let chartState = {
      labels: ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'],
      overallCounts: [0, 0, 0, 0, 0, 0, 0],
      weeklyCounts: [0, 0, 0, 0, 0, 0, 0],
      overallAdvice: '',
      weeklyAdvice: ''
    };

    function parseDate(dtStr) {
      if (!dtStr) return null;
      return new Date(dtStr.replace(' ', 'T'));
    }

    function switchChart(mode) {
      const btnOverall = document.getElementById('btn-overall');
      const btnWeekly = document.getElementById('btn-weekly');
      const adviceEl = document.getElementById('insight-text');

      if (!myChart || !btnOverall || !btnWeekly) return;

      if (mode === 'overall') {
        btnOverall.classList.add('active');
        btnWeekly.classList.remove('active');
        myChart.data.datasets[0].data = chartState.overallCounts;
        myChart.data.datasets[0].backgroundColor = '#06C755';
        adviceEl.innerHTML = chartState.overallAdvice;
      } else {
        btnWeekly.classList.add('active');
        btnOverall.classList.remove('active');
        myChart.data.datasets[0].data = chartState.weeklyCounts;
        myChart.data.datasets[0].backgroundColor = '#3b82f6';
        adviceEl.innerHTML = chartState.weeklyAdvice;
      }
      myChart.update();
    }

    async function fetchData() {
      const container = document.getElementById('content-container');
      container.innerHTML = '<div class="loading-box">🔄 กำลังดึงข้อมูลล่าสุด...</div>';

      try {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const idToken = liff.getIDToken();

        const response = await fetch('https://lanka-and-route-vsnet.trycloudflare.com/webhook/72fb0b75-69ec-4a82-9f8b-1f895eea30f2?_t=' + Date.now(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ id_token: idToken })
        });

        if (!response.ok) {
          throw new Error('เซิร์ฟเวอร์ตอบกลับสถานะ ' + response.status);
        }

        const resData = await response.json();
        
        let list = [];
        if (Array.isArray(resData)) {
          list = resData;
        } else if (resData.data && Array.isArray(resData.data)) {
          list = resData.data;
        } else if (typeof resData === 'object' && Object.keys(resData).length > 0) {
          list = [resData];
        }

        // กรองแถวว่างเปล่าออก
        list = list.filter(item => {
          const row = item.json || item;
          return row && (row.event || row.datetime || row.location || row.title);
        });

        const now = new Date();
        const next7Days = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

        let total = list.length;
        let done = 0, upcoming = 0, cancelled = 0;
        let categories = {};
        
        const dayLabels = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];
        const overallCounts = [0, 0, 0, 0, 0, 0, 0];
        const weeklyCounts = [0, 0, 0, 0, 0, 0, 0];

        list.forEach(item => {
          const row = item.json || item;
          const st = (row.status || '').toLowerCase().trim();
          const dt = parseDate(row.datetime);

          if (st === 'done') {
            done++;
          } else if (st === 'cancelled' || st === 'ยกเลิก' || (dt && dt < now)) {
            cancelled++;
          } else {
            upcoming++;
          }

          const cat = row.category || 'ทั่วไป';
          categories[cat] = (categories[cat] || 0) + 1;

          if (dt && !isNaN(dt.getTime())) {
            let dayIdx = dt.getDay() - 1; 
            if (dayIdx === -1) dayIdx = 6;
            
            // สถิติภาพรวมลูปชีวิต
            overallCounts[dayIdx]++;

            // สถิติเฉพาะ 7 วันข้างหน้า
            if (dt >= now && dt <= next7Days && st !== 'done' && st !== 'cancelled' && st !== 'ยกเลิก') {
              weeklyCounts[dayIdx]++;
            }
          }
        });

        // คำนวณ Insight แผน 2 (ภาพรวม)
        const maxOverall = Math.max(...overallCounts);
        let overallAdvice = 'ตารางเวลาของคุณกระจายตัวได้ดีมาก ไม่มีวันไหนที่แน่นเกินไปครับ';
        if (total === 0) {
          overallAdvice = '🦉 ตอนนี้ยังไม่มีนัดหมายในระบบ เริ่มสร้างนัดแรกกับน้องนัดดีได้เลยครับ';
        } else if (maxOverall >= 3) {
          const busyDay = dayLabels[overallCounts.indexOf(maxOverall)];
          overallAdvice = `💡 <b>วัน${busyDay}</b> คือวันด่านหินของคุณ! (มีงานสะสมถึง ${maxOverall} รายการ) สัปดาห์ไหนที่มีเรียนหรือนัดในวันนี้ ควรเคลียร์งานล่วงหน้านะครับ`;
        }

        // คำนวณ Insight แผน 1 (7 วันนี้)
        const maxWeekly = Math.max(...weeklyCounts);
        let weeklyAdvice = '🎉 7 วันนี้ตารางของคุณโล่งมาก ไม่มีนัดหมายที่ต้องกังวลเลย!';
        if (maxWeekly > 0) {
          const busyWeeklyDay = dayLabels[weeklyCounts.indexOf(maxWeekly)];
          weeklyAdvice = `⚡ ใน 7 วันข้างหน้า วันที่งานแน่นที่สุดคือ <b>วัน${busyWeeklyDay}</b> (${maxWeekly} รายการ) อย่าลืมเตรียมพร้อมล่วงหน้านะครับ`;
        }

        chartState = {
          labels: dayLabels,
          overallCounts,
          weeklyCounts,
          overallAdvice,
          weeklyAdvice
        };

        // แสดงหมวดหมู่
        let catHtml = '';
        if (Object.keys(categories).length > 0 && total > 0) {
          for (const [catName, count] of Object.entries(categories)) {
            const pct = Math.round((count / total) * 100);
            catHtml += `
              <div class="cat-item">
                <div class="cat-header">
                  <span>📁 ${catName}</span>
                  <span>${count} งาน (${pct}%)</span>
                </div>
                <div class="cat-bar-bg">
                  <div class="cat-bar-fill" style="width: ${pct}%;"></div>
                </div>
              </div>
            `;
          }
        } else {
          catHtml = '<div style="color:#94a3b8; font-size:13px; text-align:center; padding: 10px 0;">ไม่มีข้อมูลหมวดหมู่</div>';
        }

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card total">
              <div class="stat-title">📋 ทั้งหมด</div>
              <div class="stat-value">${total}</div>
            </div>
            <div class="stat-card done">
              <div class="stat-title">✅ เสร็จสิ้นแล้ว</div>
              <div class="stat-value">${done}</div>
            </div>
            <div class="stat-card upcoming">
              <div class="stat-title">⏳ รอดำเนินการ</div>
              <div class="stat-value">${upcoming}</div>
            </div>
            <div class="stat-card cancelled">
              <div class="stat-title">❌ ยกเลิก/เลยกำหนด</div>
              <div class="stat-value">${cancelled}</div>
            </div>
          </div>

          <div class="section-card">
            <div class="section-header-wrap">
              <div class="section-title">📊 ความหนาแน่นของตารางนัดหมาย</div>
              <div class="toggle-container">
                <button id="btn-overall" class="toggle-btn active" onclick="switchChart('overall')">ลูปชีวิตภาพรวม</button>
                <button id="btn-weekly" class="toggle-btn" onclick="switchChart('weekly')">7 วันข้างหน้า</button>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="trafficChart"></canvas>
            </div>
          </div>

          <div class="insight-card">
            <div class="insight-header">💡 ข้อคิดเห็น & คำแนะนำ</div>
            <div id="insight-text" class="insight-body">${overallAdvice}</div>
          </div>

          <div class="section-card">
            <div class="section-title">📁 สัดส่วนตามหมวดหมู่</div>
            ${catHtml}
          </div>
        `;

        const ctx = document.getElementById('trafficChart').getContext('2d');
        myChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: dayLabels,
            datasets: [{
              label: 'จำนวนนัดหมาย',
              data: overallCounts,
              backgroundColor: '#06C755',
              borderRadius: 6,
              maxBarThickness: 26
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                beginAtZero: true,
                suggestedMax: 3,
                ticks: { stepSize: 1, precision: 0 }
              },
              x: { grid: { display: false } }
            }
          }
        });

      } catch (err) {
        container.innerHTML = `<div class="loading-box" style="color:#ef4444;">⚠️ เกิดข้อผิดพลาด: ${err.message}</div>`;
      }
    }

    window.onload = async function() {
      await liff.init({ liffId: "2011350023-6ASKwrct" });
      fetchData();
    };
  </script>
</body>
</html>

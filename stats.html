<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สถิติของฉัน - LINE LIFF</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }

    .header { margin-bottom: 16px; }
    h2 { margin: 0 0 4px 0; color: #06C755; font-size: 22px; font-weight: 700; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0; }

    /* การ์ดสถิติ 4 ช่อง */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border-left: 5px solid #cbd5e1;
    }
    .stat-card.total { border-left-color: #3b82f6; }
    .stat-card.done { border-left-color: #10b981; }
    .stat-card.upcoming { border-left-color: #f59e0b; }
    .stat-card.cancelled { border-left-color: #ef4444; }

    .stat-title { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 800; color: #0f172a; }

    /* กล่องกราฟ & สัดส่วน */
    .section-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chart-container {
      position: relative;
      height: 200px;
      width: 100%;
    }

    /* กล่องคำแนะนำ */
    .insight-card {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .insight-header {
      font-size: 13px;
      font-weight: 700;
      color: #166534;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .insight-body {
      font-size: 13px;
      color: #15803d;
      line-height: 1.55;
    }

    /* รายการหมวดหมู่ */
    .cat-item { margin-bottom: 10px; }
    .cat-item:last-child { margin-bottom: 0; }
    .cat-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 4px;
    }
    .cat-bar-bg {
      background: #f1f5f9;
      height: 7px;
      border-radius: 10px;
      overflow: hidden;
    }
    .cat-bar-fill {
      background: #06C755;
      height: 100%;
      border-radius: 10px;
    }

    .btn-refresh {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 13px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-refresh:active { background: #f8fafc; }

    .loading-box {
      background: #ffffff;
      padding: 35px 20px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>แดชบอร์ดสถิติ</h2>
    <p class="subtitle">ภาพรวมและบทวิเคราะห์ตารางนัดหมายของคุณ</p>
  </div>

  <div id="content-container">
    <div class="loading-box">🔄 กำลังวิเคราะห์ข้อมูลสถิติ...</div>
  </div>

  <button class="btn-refresh" onclick="fetchData()">🔄 รีเฟรชข้อมูล</button>

  <script>
    async function fetchData() {
      const container = document.getElementById('content-container');
      container.innerHTML = '<div class="loading-box">🔄 กำลังดึงข้อมูลล่าสุด...</div>';

      try {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const idToken = liff.getIDToken();

        const response = await fetch('https://lanka-and-route-vsnet.trycloudflare.com/webhook/72fb0b75-69ec-4a82-9f8b-1f895eea30f2?_t=' + Date.now(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ id_token: idToken })
        });

        if (!response.ok) {
          throw new Error('เซิร์ฟเวอร์ตอบกลับสถานะ ' + response.status);
        }

        const res = await response.json();
        const d = res.data || res;
        const s = d.summary || { total: 0, done: 0, upcoming: 0, cancelled: 0 };
        const categories = d.categories || {};
        const traffic = d.traffic || { labels: [], counts: [] };

        // สร้างแถบแสดงหมวดหมู่
        let catHtml = '';
        if (Object.keys(categories).length > 0) {
          for (const [catName, count] of Object.entries(categories)) {
            const pct = s.total > 0 ? Math.round((count / s.total) * 100) : 0;
            catHtml += `
              <div class="cat-item">
                <div class="cat-header">
                  <span>📁 ${catName}</span>
                  <span>${count} งาน (${pct}%)</span>
                </div>
                <div class="cat-bar-bg">
                  <div class="cat-bar-fill" style="width: ${pct}%;"></div>
                </div>
              </div>
            `;
          }
        } else {
          catHtml = '<div style="color:#94a3b8; font-size:13px;">ยังไม่มีข้อมูลหมวดหมู่</div>';
        }

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card total">
              <div class="stat-title">📋 ทั้งหมด</div>
              <div class="stat-value">${s.total}</div>
            </div>
            <div class="stat-card done">
              <div class="stat-title">✅ เสร็จสิ้นแล้ว</div>
              <div class="stat-value">${s.done}</div>
            </div>
            <div class="stat-card upcoming">
              <div class="stat-title">⏳ รอดำเนินการ</div>
              <div class="stat-value">${s.upcoming}</div>
            </div>
            <div class="stat-card cancelled">
              <div class="stat-title">❌ ยกเลิก/เลยกำหนด</div>
              <div class="stat-value">${s.cancelled}</div>
            </div>
          </div>

          <div class="section-card">
            <div class="section-title">📊 สถิตินัดหมายตามวันในสัปดาห์</div>
            <div class="chart-container">
              <canvas id="trafficChart"></canvas>
            </div>
          </div>

          <div class="insight-card">
            <div class="insight-header">💡 ข้อคิดเห็น & สรุปภาพรวม</div>
            <div class="insight-body">${d.advice || 'ไม่มีคำแนะนำ'}</div>
          </div>

          <div class="section-card">
            <div class="section-title">📁 สัดส่วนตามหมวดหมู่</div>
            ${catHtml}
          </div>
        `;

        // วาดกราฟแท่ง
        const ctx = document.getElementById('trafficChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: traffic.labels,
            datasets: [{
              label: 'จำนวนนัดหมาย',
              data: traffic.counts,
              backgroundColor: '#06C755',
              borderRadius: 6,
              maxBarThickness: 28
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
              x: { grid: { display: false } }
            }
          }
        });

      } catch (err) {
        container.innerHTML = `<div class="loading-box" style="color:#ef4444;">⚠️ เกิดข้อผิดพลาด: ${err.message}</div>`;
      }
    }

    window.onload = async function() {
      await liff.init({ liffId: "2011350023-6ASKwrct" });
      fetchData();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สถิติของฉัน - LINE LIFF</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 16px;
      color: #1f2937;
    }

    .header-section { margin-bottom: 16px; }
    h2 { margin: 0 0 4px 0; color: #06C755; font-size: 22px; font-weight: 700; }
    .subtitle { color: #6b7280; font-size: 13px; margin: 0; }

    /* 4 การ์ดหลัก */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      border-left: 4px solid #06C755;
    }
    .stat-card.total { border-left-color: #3b82f6; }
    .stat-card.done { border-left-color: #10b981; }
    .stat-card.upcoming { border-left-color: #f59e0b; }
    .stat-card.cancelled { border-left-color: #ef4444; }

    .stat-title { font-size: 12px; font-weight: 500; color: #6b7280; margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 700; color: #111827; }

    /* กล่องหมวดหมู่ และ กล่องคำแนะนำ */
    .section-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* รายการหมวดหมู่ */
    .cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
    }
    .cat-item:last-child { border-bottom: none; }
    .cat-badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
    }

    /* กล่องคำแนะนำอัจฉริยะ */
    .insight-card {
      background: linear-gradient(135deg, #f0fdf4 0%, #e8f5e9 100%);
      border: 1px solid #bbf7d0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .insight-header {
      font-size: 13px;
      font-weight: 700;
      color: #166534;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .insight-body {
      font-size: 13px;
      color: #15803d;
      line-height: 1.5;
    }

    /* ปุ่มกด */
    .btn-refresh {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #374151;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-refresh:active { background: #f3f4f6; }

    /* สถานะโหลด */
    .loading-box {
      background: #ffffff;
      padding: 35px 20px;
      border-radius: 14px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header-section">
    <h2>แดชบอร์ดสถิติ</h2>
    <p class="subtitle">ภาพรวมและบทวิเคราะห์การนัดหมายของคุณ</p>
  </div>

  <div id="content-container">
    <div class="loading-box">🔄 กำลังวิเคราะห์และโหลดข้อมูลสถิติ...</div>
  </div>

  <button class="btn-refresh" onclick="fetchData()">🔄 รีเฟรชข้อมูล</button>

  <script>
    async function fetchData() {
      const container = document.getElementById('content-container');
      container.innerHTML = '<div class="loading-box">🔄 กำลังดึงข้อมูลล่าสุด...</div>';

      try {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const idToken = liff.getIDToken();

        // ใส่ Timestamp ป้องกันแคชของ LINE In-App Browser
        const response = await fetch('https://lanka-and-route-vsnet.trycloudflare.com/webhook/72fb0b75-69ec-4a82-9f8b-1f895eea30f2?_t=' + Date.now(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ id_token: idToken })
        });

        const result = await response.json();
        const d = result.data || result;
        const s = d.summary || {};

        // สร้าง HTML แสดงแยกหมวดหมู่
        let catHtml = '';
        if (d.categories && Object.keys(d.categories).length > 0) {
          for (const [catName, count] of Object.entries(d.categories)) {
            catHtml += `
              <div class="cat-item">
                <span>📁 ${catName}</span>
                <span class="cat-badge">${count} งาน</span>
              </div>
            `;
          }
        } else {
          catHtml = '<div style="color:#9ca3af; font-size:13px;">ยังไม่มีข้อมูลหมวดหมู่</div>';
        }

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card total">
              <div class="stat-title">📋 นัดหมายทั้งหมด</div>
              <div class="stat-value">${s.total ?? 0}</div>
            </div>
            <div class="stat-card done">
              <div class="stat-title">✅ เสร็จสิ้นแล้ว</div>
              <div class="stat-value">${s.done ?? 0}</div>
            </div>
            <div class="stat-card upcoming">
              <div class="stat-title">⏳ รอดำเนินการ</div>
              <div class="stat-value">${s.upcoming ?? 0}</div>
            </div>
            <div class="stat-card cancelled">
              <div class="stat-title">❌ ยกเลิก/ค้างส่ง</div>
              <div class="stat-value">${s.cancelled ?? 0}</div>
            </div>
          </div>

          <div class="insight-card">
            <div class="insight-header">💡 ข้อคิดเห็น & สรุปภาพรวม</div>
            <div class="insight-body">${d.advice || 'ไม่มีข้อมูลคำแนะนำ'}</div>
          </div>

          <div class="section-card">
            <div class="section-title">📊 การนัดหมายแยกตามหมวดหมู่</div>
            ${catHtml}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="loading-box" style="color:red;">⚠️ เกิดข้อผิดพลาด: ${err.message}</div>`;
      }
    }

    window.onload = async function() {
      await liff.init({ liffId: "2011350023-6ASKwrct" }); // ใส่ LIFF ID ของคุณ
      fetchData();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นัดหมายทั้งหมดของฉัน 🦉</title>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F8F7F4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1F2D0F; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .active-filter { background-color: #4A5D4E; color: white; }
        .inactive-filter { background-color: #FFFFFF; color: #556B2F; border: 1px solid #E5E5E5; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen">

    <!-- Header -->
    <div class="bg-[#4A5D4E] text-white p-5 rounded-2xl shadow-md mb-4 text-center">
        <h1 class="text-xl font-bold tracking-tight">🦉 นัดหมายทั้งหมดของคุณ</h1>
        <p class="text-xs text-[#E5E5E5] mt-1">รายการนัดหมายและตารางชีวิตที่บันทึกไว้</p>
    </div>

    <!-- ปุ่มเคลียร์ตัวกรอง (ซ่อนไว้ก่อน จะแสดงเฉพาะตอนที่ถูกกดมาจากหน้าสถิติ) -->
    <div id="filter-banner" class="hidden mb-3 flex justify-between items-center bg-[#EAEFE9] px-4 py-2.5 rounded-xl border border-[#D0DDD0]">
        <span class="text-xs font-semibold text-[#4A5D4E]" id="filter-text">🔍 แสดงเฉพาะ: รอดำเนินการ</span>
        <button onclick="clearFilter()" class="text-xs bg-white text-[#4A5D4E] px-2.5 py-1 rounded-lg border border-[#C2D0C2] hover:bg-[#4A5D4E] hover:text-white transition">
            ดูทั้งหมด ✕
        </button>
    </div>
    
    <!-- Category Filter Bar (จะถูกสร้างด้วย JS) -->
    <div id="filter-container" class="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-3">
        <!-- ปุ่มฟิลเตอร์จะมาอยู่ตรงนี้ -->
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="text-center py-12">
        <p class="text-sm text-gray-500 animate-pulse">กำลังโหลดข้อมูลนัดหมาย...</p>
    </div>

    <!-- Appointment List -->
    <div id="appointment-container" class="space-y-3.5" style="display: none;">
        <!-- การ์ดนัดหมายจะถูกสร้างด้วย JS -->
    </div>

    <script>
        // 🔴 1. ใส่ LIFF ID และ URL Cloudflared
        const LIFF_ID = "2011350023-z3qS09LJ"; 
        const N8N_API_URL = "https://ringtone-operate-movements-silent.trycloudflare.com/webhook/a3083faa-b717-4e24-b053-ce1bc7563a50"; 

        async function main() {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const idToken = liff.getIDToken();
                fetchAppointments(idToken);
            } else {
                liff.login();
            }
        }

        async function fetchAppointments(token) {
            try {
                const response = await fetch(N8N_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                if (!response.ok) throw new Error("Network response error");
                
                let rawData = await response.json();
                
                // ป้องกันกรณี n8n ส่งมาแบบห่อ { json: { ... } } หรือแบบเรียบๆ
                const data = rawData.map(item => item.json ? item.json : item);
                renderAppointments(data);

                // ตรวจสอบ URL Filter หลังจากเรนเดอร์การ์ดเสร็จเรียบร้อยแล้ว
                checkUrlFilterOnLoad();

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loading-state').innerHTML = `<p class="text-red-500 text-sm">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่</p>`;
            }
        }

        // ฟังก์ชันป้องกัน XSS
        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ฟังก์ชันคำนวณเวลา
        function formatStatus(status, datetimeStr, now) {
            if (status === 'done') {
                return { text: 'เสร็จสิ้น', isDone: true, isCancelled: false, badgeClass: 'bg-gray-100 text-gray-500 border-gray-200' };
            }
            if (!datetimeStr) {
                return { text: status || 'รอดำเนินการ', isDone: false, isCancelled: false, badgeClass: 'bg-emerald-50 text-[#4A5D4E] border-emerald-200' };
            }

            const targetDate = new Date(datetimeStr.toString().replace(' ', 'T'));
            const diffMs = targetDate - now;

            if (isNaN(diffMs)) {
                return { text: status || 'active', isDone: false, isCancelled: false, badgeClass: 'bg-emerald-50 text-[#4A5D4E] border-emerald-200' };
            }

            if (diffMs < 0) {
                return { text: 'ยกเลิกแล้ว', isDone: false, isCancelled: true, badgeClass: 'bg-gray-100 text-gray-500 border-gray-200' };
            }

            const diffMinutes = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMinutes / 60);
            const diffDays = Math.floor(diffHours / 24);

            let timeText = '';
            if (diffDays > 0) {
                const remainHours = diffHours % 24;
                timeText = `อีก ${diffDays} วัน ${remainHours > 0 ? remainHours + ' ชม.' : ''}`;
            } else if (diffHours > 0) {
                const remainMins = diffMinutes % 60;
                timeText = `อีก ${diffHours} ชม. ${remainMins > 0 ? remainMins + ' นาที' : ''}`;
            } else {
                timeText = `อีก ${Math.max(1, diffMinutes)} นาที`;
            }

            return { text: timeText, isDone: false, isCancelled: false, badgeClass: 'bg-emerald-50 text-[#4A5D4E] border-emerald-200' };
        }

        // ฟังก์ชันฟิลเตอร์หมวดหมู่
        window.filterCategory = function(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = 'filter-btn inactive-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all';
            });
            btn.className = 'filter-btn active-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all shadow-sm';

            const cards = document.querySelectorAll('.appointment-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        // ฟังก์ชันตรวจจับ URL ตอนโหลดหน้าเว็บ (วางไว้นอก renderAppointments)
        function checkUrlFilterOnLoad() {
            const urlParams = new URLSearchParams(window.location.search);
            const filterType = urlParams.get('filter'); // เช่น ?filter=pending

            if (filterType === 'pending') {
                applyPendingFilter();
            }
        }

        // ฟังก์ชันกรองเฉพาะรายการรอดำเนินการ
        function applyPendingFilter() {
            document.getElementById('filter-banner').style.display = 'flex';

            const cards = document.querySelectorAll('.appointment-card');
            cards.forEach(card => {
                const isMuted = card.classList.contains('opacity-65');
                if (isMuted) {
                    card.style.display = 'none'; // ซ่อนรายการที่จบ/ยกเลิกแล้ว
                } else {
                    card.style.display = 'block'; // แสดงเฉพาะรายการรอดำเนินการ
                }
            });
        }

        // ฟังก์ชันกดปุ่ม "ดูทั้งหมด" เพื่อเคลียร์การกรอง
        function clearFilter() {
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById('filter-banner').style.display = 'none';

            const cards = document.querySelectorAll('.appointment-card');
            cards.forEach(card => {
                card.style.display = 'block';
            });
        }

        // เรนเดอร์ UI หลัก
        function renderAppointments(data) {
            document.getElementById('loading-state').style.display = 'none';
            const container = document.getElementById('appointment-container');
            const filterContainer = document.getElementById('filter-container');
            container.style.display = 'block';

            const now = new Date();
            const pastCutoff = new Date(now.getTime() - (60 * 24 * 60 * 60 * 1000));
            const activeItems = [];
            const pastItems = [];
            const categoriesSet = new Set();

            // คัดแยกข้อมูล
            data.forEach(item => {
                if (!item.event) return;
                
                const category = item.category || 'ทั่วไป';
                categoriesSet.add(category);

                const dtStr = item.datetime;
                const status = item.status;
                const targetDate = new Date((dtStr || '9999-12-31').replace(' ', 'T'));
                
                const isDone = status === 'done';
                const isPast = targetDate.getTime() < now.getTime();

                if (isDone || isPast) {
                    if (targetDate.getTime() >= pastCutoff.getTime()) pastItems.push(item);
                } else {
                    activeItems.push(item);
                }
            });

            // เรียงลำดับ
            activeItems.sort((a, b) => new Date((a.datetime || '9999-12-31').replace(' ', 'T')).getTime() - new Date((b.datetime || '9999-12-31').replace(' ', 'T')).getTime());
            pastItems.sort((a, b) => new Date((b.datetime || '1970-01-01').replace(' ', 'T')).getTime() - new Date((a.datetime || '1970-01-01').replace(' ', 'T')).getTime());

            // ฟังก์ชันสร้างการ์ด 1 ใบ
            const createCardHTML = (data) => {
                const category = data.category || 'ทั่วไป';
                const statusInfo = formatStatus(data.status, data.datetime, now);
                const isMuted = statusInfo.isDone || statusInfo.isCancelled;
                const stripeColor = isMuted ? 'bg-gray-300' : 'bg-[#4A5D4E]';
                const cardOpacity = isMuted ? 'opacity-65 bg-[#FAFAFA]' : 'bg-white';
                
                let titleColor = 'text-[#1F2D0F]';
                if (statusInfo.isCancelled) titleColor = 'text-gray-400 line-through';
                else if (statusInfo.isDone) titleColor = 'text-gray-400';

                return `
                    <div class="appointment-card ${cardOpacity} p-4 rounded-2xl shadow-sm border border-[#E5E5E5] relative overflow-hidden transition-all duration-200" 
                         data-category="${escapeHtml(category)}">
                        <div class="absolute top-0 left-0 bottom-0 w-2 ${stripeColor}"></div>
                        <div class="pl-2">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-[11px] font-medium bg-[#F8F7F4] text-[#4A5D4E] px-2.5 py-0.5 rounded-full border border-gray-200">
                                    📌 ${escapeHtml(category)}
                                </span>
                                <span class="text-[11px] font-medium px-2 py-0.5 rounded-md border ${statusInfo.badgeClass}">
                                    ${escapeHtml(statusInfo.text)}
                                </span>
                            </div>
                            <h3 class="font-bold text-base ${titleColor} mt-1">${escapeHtml(data.event || '-')}</h3>
                            <div class="mt-3 space-y-1 text-xs text-gray-600">
                                <p class="flex items-center gap-1.5">📅 <span><strong>เวลา:</strong> ${escapeHtml(data.datetime || '-')}</span></p>
                                <p class="flex items-center gap-1.5">📍 <span><strong>สถานที่:</strong> ${escapeHtml(data.location || '-')}</span></p>
                            </div>
                        </div>
                    </div>`;
            };

            let cardsHtml = '';
            if (activeItems.length === 0 && pastItems.length === 0) {
                cardsHtml = `
                    <div class="text-center py-12 bg-white rounded-2xl shadow-sm p-6 border border-[#E5E5E5]">
                        <span class="text-4xl">📭</span>
                        <p class="mt-3 font-semibold text-gray-700">ยังไม่มีนัดหมายในระบบ</p>
                        <p class="text-xs text-gray-400 mt-1">พิมพ์บอกเวลานัดกับบอทในแชทได้เลยนะฮะ</p>
                    </div>`;
            } else {
                if (activeItems.length > 0) cardsHtml += activeItems.map(createCardHTML).join('');
                if (pastItems.length > 0) {
                    cardsHtml += `
                        <div class="pt-4 pb-1 text-center">
                            <span class="text-[11px] font-semibold text-gray-400 bg-[#EFEFEF] px-3 py-1 rounded-full">
                                ประวัติที่ผ่านมา (60 วันล่าสุด)
                            </span>
                        </div>`;
                    cardsHtml += pastItems.map(createCardHTML).join('');
                }
            }
            container.innerHTML = cardsHtml;

            // สร้างปุ่มหมวดหมู่
            let filterButtonsHtml = `<button onclick="filterCategory('all', this)" class="filter-btn active-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all shadow-sm">ทั้งหมด</button>`;
            categoriesSet.forEach(cat => {
                filterButtonsHtml += `<button onclick="filterCategory('${escapeHtml(cat)}', this)" class="filter-btn inactive-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all">${escapeHtml(cat)}</button>`;
            });
            filterContainer.innerHTML = filterButtonsHtml;
        }

        // เริ่มต้น
        main();
    </script>
</body>
</html>
